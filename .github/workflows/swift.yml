# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift
name: Back-merge release to main

on:
  push:
    tags:
      - "v*"

jobs:
  backmerge:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release branch
        id: release
        run: |
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          RELEASE_BRANCH=$(git branch -r --contains $TAG_COMMIT | grep 'origin/release/' | head -n1 | sed 's|origin/||')
          if [ -z "$RELEASE_BRANCH" ]; then
            echo "Tag is not on a release branch"
            exit 1
          fi
          echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Create back-merge PR
        uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: ${{ steps.release.outputs.branch }}
          destination_branch: main
          pr_title: "chore: back-merge ${{ steps.release.outputs.branch }} into main"
          pr_body: |
            Automated back-merge after release tag ${{ github.ref_name }}.
            - Source: ${{ steps.release.outputs.branch }}
            - Target: main
          pr_label: |
            release
            backmerge

